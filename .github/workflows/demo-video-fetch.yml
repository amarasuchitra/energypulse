name: demo video fetch
on:
  push:
    branches: [demo-video-fetch]
permissions:
  contents: write
  actions: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: demo-video
          run-id: 44872461057
          github-token: ${{ github.token }}
          path: /tmp/video
      - run: |
          git config user.name amarasuchitra
          git config user.email amarasuchitra.23aiml@saividya.ac.in
          git checkout --orphan demo-video-out
          git rm -rfq .
          cp -r /tmp/video/* . && find . -name "*.webm" -size +90M -exec split -b 80m -d {} {}.part ; -exec rm {} ; && git add -A && git commit -qm "demo video recording" && git push -f origin demo-video-out
