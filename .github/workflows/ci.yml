name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install --timeout 300 --retries 3 -r requirements.txt
          pip install pytest
      
      - name: Run prediction pipeline tests
        run: |
          python -m pytest tests/test_prediction_pipeline.py -v
      
      - name: Run new features tests
        run: |
          python -m pytest tests/test_new_features.py -v --tb=short
      
      - name: Run CSV import tests
        run: |
          python -m pytest tests/test_csv_import.py -v --tb=short
      
      - name: Run toolkit tests
        run: |
          python -m pytest tests/test_toolkit.py -v --tb=short
      
      - name: Run all other tests
        run: |
          python -m pytest tests/test_appliance_intelligence.py tests/test_chatbot_routing.py tests/test_notifications.py -v --tb=short

      - name: Run scheduler, sign-in, meter API, ensemble and interval tests
        run: |
          python -m pytest tests/test_scheduler_jobs.py tests/test_remember_me.py tests/test_meter_api.py tests/test_ensemble.py tests/test_optimization.py -v --tb=short

      - name: Run monitoring and appliance-setup tests
        run: |
          python -m pytest tests/test_monitoring.py tests/test_home_config.py tests/test_forecast_sim.py -v --tb=short
      
      - name: Check imports
        run: |
          python -c "import sys; sys.path[:0] = ['frontend', 'backend']; import app; print('App imports OK')"
      
      - name: Lint (basic)
        run: |
          python -m compileall -q frontend backend tests
          echo "Syntax check passed"

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: energypulse:latest
          load: true
        continue-on-error: true
      
      - name: Test Docker image
        if: success()
        run: |
          docker run --rm -d --name energypulse-test -p 8501:8501 energypulse:latest
          sleep 30
          curl -f http://localhost:8501/_stcore/health
          docker stop energypulse-test
        continue-on-error: true