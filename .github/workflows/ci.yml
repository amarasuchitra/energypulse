name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install --timeout 300 --retries 3 -r requirements.txt
          # Test-only tools: pytest runs the suite, pytest-cov measures line coverage.
          pip install pytest pytest-cov

      - name: Lint (syntax)
        run: |
          python -m compileall -q frontend backend tests
          echo "Syntax check passed"

      - name: Check imports
        run: |
          python -c "import sys; sys.path[:0] = ['frontend', 'backend']; import app; print('App imports OK')"

      - name: Run the full test suite (with coverage)
        id: tests
        continue-on-error: true
        env:
          ENERGYPULSE_NO_SCHEDULER: "1"
          ENERGYPULSE_DISABLE_LSTM: "1"
        run: |
          mkdir -p tests/reports
          python -m pytest tests -q -rs --durations=20 \
            --junitxml=tests/reports/junit.xml \
            --cov=backend --cov=frontend --cov-report=term --cov-report=json:tests/reports/coverage.json

      - name: Report results by brief test ID
        if: always()
        run: python tests/report_summary.py

      - name: Fail if the tests failed
        if: steps.tests.outcome != 'success'
        run: exit 1

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: energypulse:latest
          load: true
        continue-on-error: true
      
      - name: Test Docker image
        if: success()
        run: |
          docker run --rm -d --name energypulse-test -p 8501:8501 energypulse:latest
          sleep 30
          curl -f http://localhost:8501/_stcore/health
          docker stop energypulse-test
        continue-on-error: true